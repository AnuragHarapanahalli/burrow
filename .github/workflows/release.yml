# Release Burrow by pushing a version tag:
#   npm version patch        (0.2.0 -> 0.2.1: updates package.json, commits, tags v0.2.1)
#   git push --follow-tags   (pushes the commit and the tag)
# GitHub then builds the installer and portable copy on a Windows machine and publishes them as a
# release; every installed Burrow updates itself. Pushes without a tag never release anything.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload its files (GitHub's built-in token; no personal token)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must match the version in package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json ($v). Use 'npm version patch' to make both."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
