<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' burrow:; style-src 'self' burrow: 'unsafe-inline'; img-src 'self' burrow: data:">
  <title>New tab</title>
  <link rel="stylesheet" href="burrow://app/ui/base.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="grid">
    <div class="when"><span class="pixel" id="date"></span> <span class="pixel clock" id="clock"></span></div>

    <section class="hero">
      <h1>What are we<br>looking for<span class="dot">?</span></h1>
      <form id="search" class="search" autocomplete="off">
        <div class="mode-seg" id="modeToggle" role="radiogroup" aria-label="Search or ask AI">
          <button type="button" data-mode="search" role="radio" aria-checked="true">Search</button>
          <button type="button" data-mode="ask" role="radio" aria-checked="false">Ask</button>
        </div>
        <input id="q" spellcheck="false" placeholder="Search or type a URL" aria-label="Search or type a URL" autofocus>
        <span class="pixel hint" id="qHint">ENTER</span>
      </form>
      <div class="links-row">
        <nav class="links" id="links" aria-label="Quick links"></nav>
        <button class="links-edit" id="linksEdit" aria-pressed="false">Edit</button>
      </div>
      <form class="link-form" id="linkForm" hidden autocomplete="off">
        <label><span class="pixel">NAME</span><input id="lfName" maxlength="24" placeholder="Moodle" spellcheck="false"></label>
        <label class="grow"><span class="pixel">ADDRESS</span><input id="lfUrl" placeholder="moodle.college.edu" spellcheck="false"></label>
        <div class="lf-scope" id="scopeSeg" role="radiogroup" aria-label="Show this link in">
          <span class="pixel">SHOW IN</span>
          <div class="lf-seg">
            <button type="button" data-scope="all" role="radio">All workspaces</button>
            <button type="button" data-scope="ws" role="radio" id="scopeWs">Only this workspace</button>
          </div>
        </div>
        <button type="submit" class="lf-save">Save</button>
        <button type="button" class="lf-cancel" id="lfCancel">Cancel</button>
        <p class="lf-error" id="lfError" role="alert"></p>
      </form>
      <section class="chooser" id="chooser" hidden aria-labelledby="chooserTitle">
        <div class="pixel chooser-label" id="chooserTitle">ONE QUICK THING &mdash; PICK YOUR SEARCH ENGINE</div>
        <div class="chooser-grid" id="engineGrid" role="radiogroup" aria-labelledby="chooserTitle"></div>
        <p class="chooser-note">You can change this any time in Menu &rarr; Settings.</p>
      </section>
    </section>

    <footer class="foot">
      <p class="stat" id="stat"></p>
      <p class="made">Made with
        <svg class="heart" viewBox="0 0 7 6" shape-rendering="crispEdges" role="img" aria-label="love"><path d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/></svg>
        by Anurag <span class="pixel version" id="version"></span>
        <button class="bug-btn" id="bugBtn" aria-haspopup="dialog">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5h6v7H5zM8 5v7M3 7h2M11 7h2M3 10h2M11 10h2M6 5l-1-2M10 5l1-2"/></svg>
          Report a bug</button></p>
    </footer>

    <div class="mochi-spot">
      <div class="bubble" id="bubble" hidden></div>
      <div class="mochi-menu" id="mochiMenu" hidden role="menu" aria-label="Things to do with Mochi">
        <div class="mm-head pixel"><span>MOCHI</span><span id="mmCarrots"></span></div>
        <div class="mm-items" id="mmItems"></div>
      </div>
      <button id="mochi" class="mochi-btn" aria-label="Mochi: things to do" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
  </main>

  <div class="bug-scrim" id="bugScrim" hidden>
    <form class="bug-form" id="bugForm" role="dialog" aria-modal="true" aria-labelledby="bugTitleH" autocomplete="off" novalidate>
      <div class="bug-head">
        <h2 id="bugTitleH">Report a bug<span class="dot">.</span></h2>
        <button type="button" class="bug-x" id="bugClose" aria-label="Close">&times;</button>
      </div>
      <label><span class="pixel">01 SHORT TITLE</span>
        <input id="bugTitle" maxlength="120" placeholder="Tabs flicker when I switch workspace" required></label>
      <label><span class="pixel">02 WHAT HAPPENED</span>
        <textarea id="bugWhat" rows="4" maxlength="3000" placeholder="What did you see, and what did you expect instead?"></textarea></label>
      <label><span class="pixel">03 STEPS TO MAKE IT HAPPEN (OPTIONAL)</span>
        <textarea id="bugSteps" rows="3" maxlength="1500" placeholder="1. Open two workspaces&#10;2. Switch quickly with Ctrl+Shift+1 / 2"></textarea></label>
      <label class="bug-check"><input type="checkbox" id="bugSystem" checked>
        Include Burrow version and system info <span class="bug-note">(no personal data)</span></label>
      <p class="bug-error" id="bugError" role="alert"></p>
      <div class="bug-actions">
        <p class="bug-note">You'll finish on GitHub: check it, then press <b>Submit new issue</b>. Needs a free GitHub account.</p>
        <button type="button" class="bug-cancel" id="bugCancel">Cancel</button>
        <button type="submit" class="bug-go">Continue on GitHub &nearr;</button>
      </div>
    </form>
  </div>

  <script src="burrow://app/shared/theme.js"></script>
  <script src="burrow://app/shared/mochi.js"></script>
  <script src="burrow://app/shared/ai.js"></script>
  <script src="newtab.js"></script>
  <script src="quicklinks.js"></script>
  <script src="bugreport.js"></script>
</body>
</html>
